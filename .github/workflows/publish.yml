name: Publish daily feed

on:
  schedule:
    # Times are UTC. GitHub sometimes delays or skips scheduled runs, so this
    # tries many times each morning. Every run for the same Chicago date makes
    # the same feed, so extra runs are harmless: the first one that lands wins.
    # Chicago winter (UTC-6): roughly 4:17 AM to 11:47 AM. Summer: an hour later.
    - cron: "17 10 * * *"
    - cron: "47 10 * * *"
    - cron: "17 11 * * *"
    - cron: "47 11 * * *"
    - cron: "23 12 * * *"
    - cron: "53 12 * * *"
    - cron: "23 13 * * *"
    - cron: "53 13 * * *"
    - cron: "37 14 * * *"
    - cron: "37 15 * * *"
    - cron: "37 16 * * *"
    - cron: "47 17 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "content/**"
      - "config.json"
      - "scripts/**"
      - ".github/workflows/**"

permissions:
  contents: write

concurrency:
  group: daily-feed
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Generate feed
        run: python scripts/generate_feed.py

      - name: Save history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/history.json site/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Daily feed $(TZ=America/Chicago date +%F)"
            git push
          fi

